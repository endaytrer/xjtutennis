name: release

# Builds the embedded React frontend, compiles the linux/amd64 binary, and
# packages it as an RPM with nfpm. The RPM is uploaded as a build artifact on
# every run and attached to the GitHub Release when a v* tag is pushed.

on:
  push:
    branches: [stable, alpha]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach assets to releases

jobs:
  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary (linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          if [ "$VERSION" != "0.0.0" ]; then
            LDFLAGS="$LDFLAGS -X github.com/endaytrer/xjtutennis/constant.Version=$VERSION"
          fi
          go build -trimpath -ldflags "$LDFLAGS" -o dist/xjtutennis .

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build DEB
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm package --config package/nfpm.yaml --packager deb --target dist/

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm package --config package/nfpm.yaml --packager rpm --target dist/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: xjtutennis-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: xjtutennis-rpm
          path: dist/*.rpm
          if-no-files-found: error

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb dist/*.rpm